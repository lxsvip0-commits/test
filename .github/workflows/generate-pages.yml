name: Generate content pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/pages.csv
      - generate.py
      - .github/workflows/generate-pages.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate Markdown pages
        run: python generate.py --input data/pages.csv --output generated

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "No generated-page changes to commit."
            exit 0
          fi
          git commit -m "chore: generate content pages"
          git push
